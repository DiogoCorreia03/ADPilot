[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adpilot-mcp"
version = "0.1.0"
description = "ADPilot MCP Server for Active Directory Pentesting Automation"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
]

[project.scripts]
adpilot-mcp = "adpilot_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adpilot_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
